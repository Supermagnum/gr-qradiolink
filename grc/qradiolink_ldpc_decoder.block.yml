id: qradiolink_ldpc_decoder
label: LDPC Decoder (Soft-Decision)
category: '[QRadioLink]/FEC'
flags: [ python ]

parameters:
-   id: code_selection_mode
    label: Code Selection Mode
    dtype: enum
    options: ['Auto-select by Parameters', 'Custom AList File']
    option_attributes:
        use_custom: [False, True]
    default: 'Auto-select by Parameters'
-   id: block_length
    label: Block Length (bits)
    dtype: enum
    options: ['576', '1152', '2304', 'Custom']
    option_attributes:
        block_length_val: [576, 1152, 2304, 0]
    default: '576'
    hide: ${ 'all' if code_selection_mode == 'Custom AList File' else 'none' }
-   id: custom_block_length
    label: Custom Block Length (bits)
    dtype: int
    default: '576'
    hide: ${ 'none' if (code_selection_mode == 'Auto-select by Parameters' and block_length == 'Custom') else 'all' }
-   id: code_rate
    label: Code Rate
    dtype: enum
    options: ['1/2', '2/3', '3/4', 'Custom']
    option_attributes:
        rate_val: ['1/2', '2/3', '3/4', '0.5']
    default: '1/2'
    hide: ${ 'all' if code_selection_mode == 'Custom AList File' else 'none' }
-   id: custom_code_rate
    label: Custom Code Rate
    dtype: string
    default: '0.5'
    hide: ${ 'none' if (code_selection_mode == 'Auto-select by Parameters' and code_rate == 'Custom') else 'all' }
-   id: alist_file
    label: Custom AList File
    dtype: file_open
    default: '"/usr/share/gnuradio/fec/ldpc/n_0100_k_0042_gap_02.alist"'
    hide: ${ 'all' if code_selection_mode == 'Auto-select by Parameters' else 'none' }
-   id: max_iterations
    label: Max Iterations
    dtype: int
    default: '50'

inputs:
-   domain: stream
    dtype: float

outputs:
-   domain: stream
    dtype: byte

templates:
    imports: |-
        from gnuradio import fec
        import sys
        import os
        import glob
        # Try to import helper module
        try:
            from gnuradio.qradiolink.ldpc_code_helper import get_code_selection
        except ImportError:
            # Fallback: try direct import
            try:
                import importlib.util
                helper_path = os.path.join(os.environ.get('CMAKE_INSTALL_PREFIX', '/usr'), 'lib', 'python3.*', 'site-packages', 'gnuradio', 'qradiolink', 'ldpc_code_helper.py')
                helper_files = glob.glob(helper_path)
                if helper_files:
                    spec = importlib.util.spec_from_file_location("ldpc_code_helper", helper_files[0])
                    helper = importlib.util.module_from_spec(spec)
                    spec.loader.exec_module(helper)
                    get_code_selection = helper.get_code_selection
                else:
                    raise ImportError("Helper not found")
            except (ImportError, AttributeError):
                # Final fallback: simple selection function
                def get_code_selection(use_custom, custom_file, block_length, code_rate, ldpc_dir='/usr/share/gnuradio/fec/ldpc/'):
                    if use_custom and custom_file and os.path.exists(custom_file):
                        return custom_file
                    # Simple fallback
                    return '/usr/share/gnuradio/fec/ldpc/n_0100_k_0042_gap_02.alist'
    make: |-
        % if code_selection_mode == 'Custom AList File':
        selected_file = ${alist_file}
        % else:
        # Auto-select based on parameters
        bl = ${custom_block_length} if '${block_length}' == 'Custom' else ${block_length_val}
        cr = '${custom_code_rate}' if '${code_rate}' == 'Custom' else '${rate_val}'
        selected_file = get_code_selection(
            use_custom=False,
            custom_file='',
            block_length=bl,
            code_rate=cr
        )
        % endif
        fec.decoder(
            fec.ldpc_decoder_make(selected_file, ${max_iterations}),
            gr.sizeof_float,
            gr.sizeof_char)

documentation: |-
    LDPC (Low-Density Parity-Check) Soft-Decision Decoder with configurable code parameters.

    Supports both regular and irregular LDPC codes with configurable:
    - Code rate: 1/2, 2/3, 3/4, or custom
    - Block length: 576, 1152, 2304 bits, or custom
    - Custom AList file override

    This is a soft-decision decoder that uses belief propagation (also known as
    message passing) with the "tanh rule" algorithm. It accepts soft input values
    (float, typically LLRs or probabilities) and outputs hard decisions (bytes).

    Algorithm: Reduced-Complexity Decoding of LDPC Codes by Jinghu Chen et al.
    Designed for a memoryless AWGN channel.

    Code Selection Modes:
    1. Auto-select by Parameters: Automatically selects the closest matching
       LDPC code from available AList files based on block length and code rate.
       Must match the encoder's code selection.
    2. Custom AList File: Use a specific AList file (must match encoder).

    Parameters:
    - Code Selection Mode: Choose auto-selection or custom file
    - Block Length: Standard lengths (576, 1152, 2304) or custom
    - Code Rate: Standard rates (1/2, 2/3, 3/4) or custom decimal
    - Custom AList File: Path to AList file (if using custom mode)
    - Max Iterations: Maximum number of belief propagation iterations (default: 50)

    Input: Float stream (soft values, typically from demodulator)
    Output: Byte stream (hard decisions, decoded data)

    The decoder automatically selects the best matching code from available
    LDPC codes in /usr/share/gnuradio/fec/ldpc/ when using auto-select mode.

    Compatible with:
    - PSK/QPSK/SOQPSK demodulators (soft outputs)
    - LDPC encoder (matching code selection)
    - DSSS despreader (soft symbol outputs)

file_format: 1

